; TLDCoop settings. Restart the game after editing.
[net]
; Co-op starts when you pick CO-OP after NEW, RESUME or LOAD in the Survival menu; until then nothing goes online.
; autostart=1 starts it at launch with the settings below instead (for testing).
autostart=0

; The role the CO-OP setup screen starts on (it saves your last choice here):
; host = the other player joins you (your world, save, time and weather)
; join = you join a host
mode=host

; steam = join codes through Steam (no IPs, no port forwarding); the co-op menu sets this up
; local = UDP by IP, for testing on this PC (tldbot) or a LAN
transport=steam

; steam: code = your host code (your friend enters it); join_code = the code you were given
code=W5LYAE
join_code=

; local only. bind_ip=0.0.0.0 to accept LAN players; host_ip is where 'join' connects.
bind_ip=127.0.0.1
host_ip=127.0.0.1
port=27015

name=Shatsca

; Hosting: each friend who joins asks first, and you LET IN or TURN AWAY (in the lobby, or while you play).
; ask_to_join=0 lets anyone with your code straight in.
ask_to_join=1

; Hosting: each friend must have every DLC (optional content) you have installed, because your world can use
; any of it; one who doesn't is told which DLC they lack. dlc_check=0 lets them in anyway (at your own risk:
; DLC regions and items won't work for them).
dlc_check=1

; Before each co-op game your saves are copied to TLDCoop\backups; this many copies are kept (0: none)
backups=5

; How the other player sees you (they need TLDCoop\tldcoop_bodies.bundle; without it: a capsule):
;   mackenzie_indoor, astrid, molly
body=molly

; Shaders for the other player's story body: own (default) or tld (the game's own; experimental)
body_shader=own
last_host=
last_host_code=
voice=male

[struggle]
; In co-op, how long TLD's weapon picker (fists, knife, hatchet...) stays up when an animal jumps you, as a
; fraction of the game's own time: 0.5 = half (harder), 1 = unchanged
picker_scale=0.5

[hud]
; Finding each other, each switch your own (the co-op setup screen sets these too):
; names = friends' names over their heads, and an arrow at the screen's edge for those out of sight
; radar = a small round map of the area around you in a corner, with your friends on it
; chart = your map charts itself where you walk, as charcoal mapping does (your own map only)
names=1
radar=1
chart=1

[colors]
; Each player has a colour on the radar, on TLD's map and over their head (by their number: the same in every
; game). Your own pick for a friend, by their name: red, orange, yellow, green, teal, blue, purple, pink, white,
; grey, black or #RRGGBB, e.g.
; Shatsca=blue

[houselights]
; House Lights (built in): light switches work again. enabled: the host's choice (MODS page); the rest your own
enabled=1
intensity=2.0
range=1.4
white=0
no_flicker=1
cull=50
shadows=0
audio=0
reach=1
outside=0

[ambient]
; Ambient Lights (built in, after the mod by Xpazeman / Thekillergreece, MIT): daylight through each interior's
; windows that follows the time of day and the weather. In co-op the HOST decides for everyone (the CO-OP setup
; screen's MODS button); playing alone, enabled= below. The levels are your own (1 = as the mod made them).
enabled=1
intensity=1.1
range=1
; night: 0 = the game's dark nights, 1 = the mod's, 2 = brighter nights, 3 = endless day
night=1
; TLD's own indoor lighting: ambience (overall glow), fill lights, how coloured its coloured fill lights stay
ambience=0.8
fill=0.7
fill_color=0.5
aurora_intensity=0.8
aurora_saturation=1.4

[trees]
; Dynamic Trees (built in, by Fuar, The Illusion and Jods, with their permission): snow on the trees builds up
; in snowy, windy weather and goes in clear, windy weather. In co-op the HOST decides for everyone (MODS).
enabled=1

[interiors]
; Seamless Interiors (built in, by karsontr13, with his permission): a building's door takes you in and out
; without a loading screen. Being finished: off by default. In co-op the HOST decides for everyone (MODS).
enabled=0
; A building you already used without it (its interior is in your save) gets its room built from your save once
; (items, containers, furniture, curing boxes); 0 = such buildings keep the game's door. The save is only read.
import_old=1
; A building whose interior the game changed after it was brought into a room (someone went in through the game's
; own door) gets its room again from the game's record (ours is put aside). 0 = such a building keeps the game's door.
reimport_changed=1
; Rooms kept while you are in another region (or in an interior through a game's door) and put back when you
; return, instead of being built again (at most 6, only the region you just left, only rooms saved on the way out).
; 0 = every room is built again from its saved files, as before.
keep_rooms=1
; Windows show the real world outside (weather, time of day, snow), and from outside a building's windows show its
; room. 0 = painted windows as before. window_quality: 0 low (2 views, low resolution, 1 room from outside up to
; 30 m), 1 medium (4 views, 1-2 rooms, 50 m), 2 high (8 views, full resolution, 3 rooms, 100 m).
windows=1
window_quality=1
; Doors show the other side (the room from outside, the world from inside) and take you through with no fade, in
; the same pose. 0 = the short fade to black as before. door_walk=1: walking into such a door takes you through too.
door_portals=1
door_walk=1
; Inside a room: 0 = lit as the game lights its interiors (its own lighting, default); 5-100 = the outdoors' light
; from the sky at this many percent (100 = as outdoors).
indoor_light=0

[death]
; When you die, this many percent of your ordinary items are lost at random (story, mission and undroppable
; items never); the rest stay in your body for anyone to take back. 0 = keep everything.
lose_percent=70

[game]
; TLD's own screenshot keys (F8, F9, F10: a picture on every press). Off, because the mod uses those keys too.
screenshots=0

[report]
; A bug report with one key: the moment is marked in the log and coop.log, coop-prev.log, coop-prev2.log and
; coop.ini go into TLDCoop\reports\<time>_<name>.zip. all=1: in co-op every player's game makes its own report
; at the same moment. Nothing is sent anywhere. key: F1..F12, A..Z, 0..9, NUM0..NUM9, off
key=F11
all=1

[zoom]
; JustZoom (built in, by WillWunderhorn, with his permission): hold the key to zoom in; the mouse wheel (while
; holding it) zooms more or less. wheel_step 5..50 (how much a wheel notch zooms), speed 1..30 (how fast it
; zooms), smooth 1..40 (how smoothly the view turns while zoomed). Your own: the others aren't affected.
enabled=1
key=Z
wheel_step=15
speed=12
smooth=25

[emotes]
; Gestures the others see you make (a line on your HUD says which). Keys: F1..F12, A..Z, 0..9, NUM0..NUM9, off
wave=F5
point=F6
come=F7
stop=F8
yes=F3
no=F4

[clothing]
enabled=1
[food]
enabled=1

[clothing] enabled=1
